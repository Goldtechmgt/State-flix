<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stateflix Agencies - Official Launch</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-white selection:bg-red-500 selection:text-white">
    <!-- Top Announcement Banner -->
    <div class="bg-gradient-to-r from-red-600 to-amber-600 text-center py-2.5 px-4 text-xs font-bold tracking-wide uppercase shadow-lg">
        🚀 Official Global Launch: August 22nd at 2:00 PM!
    </div>

    <!-- Hero Section & Live Countdown Component -->
    <header id="countdown-header" class="relative overflow-hidden px-6 pt-16 pb-20 text-center max-w-4xl mx-auto">
        <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight mb-6 leading-tight">
            The Ultimate Digital <br><span class="bg-gradient-to-r from-red-500 via-orange-500 to-amber-500 bg-clip-text text-transparent">Earning Revolution.</span>
        </h1>
        
        <div id="timer-box" class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 max-w-xl mx-auto mb-10 backdrop-blur-sm">
            <p class="text-xs uppercase tracking-widest text-slate-400 font-bold mb-4">Countdown to Grand Launch</p>
            <div class="grid grid-cols-4 gap-2 text-center">
                <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800/80">
                    <span id="days" class="block text-2xl sm:text-3xl font-extrabold text-red-500">00</span>
                    <span class="text-[10px] text-slate-500 uppercase font-semibold">Days</span>
                </div>
                <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800/80">
                    <span id="hours" class="block text-2xl sm:text-3xl font-extrabold text-red-500">00</span>
                    <span class="text-[10px] text-slate-500 uppercase font-semibold">Hours</span>
                </div>
                <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800/80">
                    <span id="minutes" class="block text-2xl sm:text-3xl font-extrabold text-red-500">00</span>
                    <span class="text-[10px] text-slate-500 uppercase font-semibold">Mins</span>
                </div>
                <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800/80">
                    <span id="seconds" class="block text-2xl sm:text-3xl font-extrabold text-red-500">00</span>
                    <span class="text-[10px] text-slate-500 uppercase font-semibold">Secs</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Additional sections: Earning Methods, Activation Fees, etc. (Omitted for brevity) -->
    
    <script src="script.js"></script>
</body>
</html>
