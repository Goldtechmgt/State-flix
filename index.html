<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stateflix Agencies - Official Launch</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-white selection:bg-red-500 selection:text-white">
    <!-- Header with Timer and Navigation -->
    <nav class="border-b border-slate-900 bg-slate-950/80 p-6">
        <div class="text-2xl font-extrabold text-white">STATEFLIX <span class="text-sm font-medium">AGENCIES</span></div>
    </nav>
    <header id="countdown-header" class="px-6 py-16 text-center">
        <h1 class="text-4xl font-extrabold mb-6">The Ultimate Digital <span class="text-red-500">Earning</span>.</h1>
        <div id="timer-box" class="bg-slate-900/60 p-6 rounded-3xl max-w-xl mx-auto mb-10">
            <p class="text-sm text-slate-400 mb-4">Countdown to Grand Launch</p>
            <div class="grid grid-cols-4 gap-2 text-center">
                <div><span id="days" class="text-3xl font-extrabold text-red-500">00</span><p class="text-xs text-slate-500">Days</p></div>
                <div><span id="hours" class="text-3xl font-extrabold text-red-500">00</span><p class="text-xs text-slate-500">Hours</p></div>
                <div><span id="minutes" class="text-3xl font-extrabold text-red-500">00</span><p class="text-xs text-slate-500">Mins</p></div>
                <div><span id="seconds" class="text-3xl font-extrabold text-red-500">00</span><p class="text-xs text-slate-500">Secs</p></div>
            </div>
        </div>
    </header>

    <!-- Content Sections -->
    <section id="earning-methods" class="max-w-7xl mx-auto px-6 py-20">
        <h2 class="text-3xl font-extrabold text-center mb-16">How You Will Earn</h2>
        <div class="grid md:grid-cols-3 gap-8">
            <div class="bg-slate-900/40 p-8 rounded-3xl">Chat, Stream, & Play Tasks</div>
        </div>
    </section>

    <!-- Registration Form -->
    <section id="register" class="max-w-md mx-auto px-6 py-24">
        <div class="bg-slate-900 p-8 rounded-3xl">
            <h3 class="text-2xl font-bold text-center mb-6">Create Pre-Launch Profile</h3>
            <form class="space-y-4" onsubmit="event.preventDefault();">
                <input type="text" placeholder="Full Name" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800">
                <button type="submit" class="w-full bg-red-600 p-3 rounded-xl">Reserve Spot</button>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
