<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="stateflix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3030"/>
      <stop offset="100%" stop-color="#b80000"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14"
                    flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#08090d"/>

  <!-- Subtle red glow -->
  <circle cx="256" cy="230" r="175"
          fill="#e50914" opacity=".08"/>

  <!-- STATEFLIX S mark -->
  <path
    d="M365 132
       C337 105 301 92 262 92
       C211 92 170 113 148 145
       C125 178 128 214 157 237
       C177 253 207 262 246 273
       L285 284
       C300 288 306 296 301 306
       C295 318 277 324 255 324
       C224 324 195 311 171 289
       L135 332
       C166 366 207 387 257 387
       C310 387 352 369 374 334
       C396 300 391 263 361 240
       C342 225 313 216 275 205
       L235 194
       C220 190 214 183 220 173
       C226 162 242 157 260 157
       C287 157 311 168 330 185
       Z"
    fill="url(#stateflix)"
    filter="url(#shadow)"/>

  <!-- Play cutout -->
  <path
    d="M205 212
       L205 303
       L293 257
       Z"
    fill="#08090d"/>

  <!-- Small highlight -->
  <path
    d="M330 185
       C310 168 287 157 260 157"
